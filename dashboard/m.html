<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2EEE6">
  <title>Home HQ</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <header class="top">
    <h1 class="serif" id="title">Shopping</h1>
    <span class="sync" id="sync"></span>
  </header>

  <main>
    <section id="tab-shopping" class="tab">
      <form class="add" id="addForm" autocomplete="off">
        <input id="addInput" list="catalog" placeholder="Add an item…" enterkeyhint="done" aria-label="Add an item">
        <datalist id="catalog"></datalist>
        <button type="submit" aria-label="Add">＋</button>
      </form>
      <div class="seg" id="stores"></div>
      <div id="shopList"></div>
    </section>


    <div class="msg" id="locked" hidden>
      <b>Not connected.</b> Open this page once with <code>?key=</code> and the dashboard key on the end of
      the address. The key is then remembered on this phone.
    </div>
  </main>

  <div class="toast" id="toast" hidden></div>

  <nav class="tabs">
    <button data-tab="shopping" class="is-on"><span>🛒</span>Shopping</button>
    <a href="/upload"><span>🖼️</span>Photos</a>
    <a href="/?wall"><span>🖥️</span>Wall view</a>
  </nav>

  <script type="module" src="/js/mobile.js"></script>
</body>
</html>
