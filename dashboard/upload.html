<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F2EEE6">
  <title>Home HQ · Photos</title>
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.4 var(--sans); }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font: 44px/1 var(--serif); margin: 0 0 4px; }
    .sub { color: var(--mute); margin: 0 0 24px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; margin-bottom: 20px; }
    label { display: block; font-size: 14px; color: var(--mute); margin: 0 0 6px; text-transform: uppercase; letter-spacing: .06em; }
    input[type=text], select { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-s); background: #fff; margin-bottom: 16px; }
    .pick { display: block; text-align: center; padding: 28px 16px; border: 2px dashed var(--line); border-radius: var(--r); cursor: pointer; font-weight: 600; }
    .pick input { display: none; }
    .queue { list-style: none; padding: 0; margin: 16px 0 0; }
    .queue li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
    .queue .ok { color: var(--ok); } .queue .err { color: var(--alert); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .ph { position: relative; aspect-ratio: 1; border-radius: var(--r-s); overflow: hidden; background: var(--line); }
    .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ph span { position: absolute; left: 6px; bottom: 6px; right: 40px; color: #fff; font-size: 12px; text-shadow: 0 1px 3px rgba(0, 0, 0, .7); }
    .ph button { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: rgba(0, 0, 0, .55); color: #fff; font-size: 18px; cursor: pointer; }
    .msg { padding: 16px; border-radius: var(--r); background: var(--card); border: 1px solid var(--alert); color: var(--alert); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Family photos</h1>
    <p class="sub">Photos added here go into the slideshow on the frame.</p>
    <div class="msg" id="locked" hidden>This phone isn’t connected yet. Open this page once with <b>?key=</b> and the dashboard key on the end of the address.</div>
    <div id="app" hidden>
      <div class="card">
        <label for="from">Added by</label>
        <select id="from"><option value="">—</option></select>
        <label for="place">Where (optional)</label>
        <input type="text" id="place" placeholder="e.g. Grandma's garden" maxlength="80">
        <label class="pick">＋ Choose photos<input type="file" id="files" accept="image/*" multiple></label>
        <ul class="queue" id="queue"></ul>
      </div>
      <label>On the frame · <span id="count">0</span></label>
      <div class="grid" id="grid"></div>
    </div>
  </main>
  <script type="module" src="/js/upload.js"></script>
</body>
</html>
